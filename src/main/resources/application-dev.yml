eureka:
  client:
    service-url:
      defaultZone: http://localhost:19000/eureka/

server:
  port: 19010

spring:
  datasource:
    url: ${DB_DEV_URL}
    username: ${DB_DEV_USER}
    password: ${DB_DEV_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
    open-in-view: false

service:
  jwt:
    secret-key: ${JWT_SECRET_KEY}

