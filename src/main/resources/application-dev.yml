spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 40       # 최대 연결 수
      minimum-idle: 5             # 최소 유휴 연결 수
      idle-timeout: 30000         # 유휴 연결 유지 시간 (ms)
      max-lifetime: 1800000       # 커넥션 최대 수명 (ms)
      connection-timeout: 30000   # 연결 대기 시간 (ms)
      pool-name: HikariPool

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
    open-in-view: false

  config:
    import: classpath:application-key.yml

eureka:
  client:
    service-url:
      defaultZone: http://localhost:19000/eureka/

service:
  jwt:
    secret-key: ${JWT_SECRET_KEY}

server:
  port: 19010
