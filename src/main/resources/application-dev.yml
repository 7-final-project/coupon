eureka:
  client:
    service-url:
      defaultZone: http://localhost:19000/eureka/

server:
  port: 19010

spring:
  data:
    redis:
      host: ${REDIS_DEV_HOST}
      port: ${REDIS_DEV_PORT}

  datasource:
    url: ${DB_DEV_URL}
    username: ${DB_DEV_USER}
    password: ${DB_DEV_PASSWORD}
    driver-class-name: org.postgresql.Driver

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ${spring.application.name}-group
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: '*'
    topic:
      issuance-coupon-event:
        issuance-coupon-event-topic

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
    open-in-view: false

service:
  jwt:
    secret-key: ${JWT_SECRET_KEY}

